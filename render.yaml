services:
  - type: web
    name: cirbeski-pub-kviz-sodniki
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cirbeski-pub-kviz-sodniki-db
          property: connectionString
