const KEY='cirbeski-sodniki-v1';const uid=()=>Math.random().toString(36).slice(2,10);const defaults=()=>({categories:[{id:uid(),name:'Splošno znanje',questions:[1,2,3,4].map(i=>({id:uid(),text:'Vprašanje '+i,points:1}))}],teams:Array.from({length:10},(_,i)=>'Ekipa '+(i+1)),answers:{},reveal:0});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}let tab='create',fullscreen=false,judgeCategory=0,presentationMode='interim',interimVisible=false,interimReveal=0,finalRankingReveal=0;let cutoff=Number(state.cutoff)||16,interimScope='question',interimRound=1;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const questions=()=>state.categories.flatMap(c=>c.questions.map(q=>({...q,cat:c.name})));const answerPoints=(q,v)=>q.family100?(Array.isArray(v)?v.reduce((sum,n)=>sum+Number(n),0):0):(typeof v==='object'&&v!==null?Math.max(0,Number(v.manual)||0):q.custom?Math.max(0,Number(v)||0):(v===1?Number(q.points)||0:0));const scores=(limit=Infinity)=>state.teams.map((name,i)=>({name:name.trim()||'Ekipa '+(i+1),index:i,points:questions().slice(0,limit).reduce((s,q)=>s+answerPoints(q,state.answers[i+'|'+q.id]),0)})).sort((a,b)=>b.points-a.points||a.index-b.index);const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='● Samodejno shranjeno'};const btn=(s,act,cls='secondary')=>`<button class="btn ${cls}" data-action="${act}">${s}</button>`;function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));app.innerHTML=tab==='create'?renderCreate():tab==='judge'?renderJudge():renderPresent();document.body.classList.toggle('screenmode',fullscreen&&tab==='present')}
function renderCreate(){return `<section class="panel"><div class="heading"><div><h2>Pripravi svoj kviz</h2><p class="muted">Dodaj kategorije in vprašanja. Vsako vprašanje ima svojo vrednost.</p></div>${btn('+ Nova kategorija','addCat','')}</div>${state.categories.map((c,ci)=>`<div class="category"><div class="row" style="justify-content:space-between"><div class="field" style="max-width:500px"><label>Kategorija ${ci+1}</label><input data-type="cat" data-id="${c.id}" value="${esc(c.name)}" placeholder="Npr. Glasba"></div>${btn('Odstrani kategorijo','delCat:'+c.id,'danger small')}</div><div class="stack" style="margin-top:16px">${c.questions.map((q,qi)=>`<div class="question"><span class="num">${qi+1}.</span><input aria-label="Vprašanje" data-type="question" data-id="${q.id}" value="${esc(q.text)}" placeholder="Besedilo vprašanja"><input type="number" aria-label="Točke" data-type="points" data-id="${q.id}" min="0" step="0.5" value="${Number(q.points)||0}" title="Točke" ${q.custom||q.family100?'disabled style="opacity:.35"':''}><label class="toggle" style="font-size:11px"><input type="checkbox" data-type="custom" data-id="${q.id}" ${q.custom?'checked':''}> Poljubno</label><label class="toggle" style="font-size:11px"><input type="checkbox" data-type="family100" data-id="${q.id}" ${q.family100?'checked':''}> 100 ljudi (5–1 t.)</label><button class="btn secondary small" data-action="delQ:${c.id}:${q.id}" aria-label="Odstrani">×</button></div>`).join('')}</div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="hint">Vrstica: vprašanje · točke · poljubno · odstrani</span>${btn('+ Dodaj vprašanje','addQ:'+c.id,'secondary small')}</div></div>`).join('')}<div class="row">${btn('Nadaljuj na sodnike →','goJudge','')}</div></section><section class="panel"><h3>Varnostna kopija kviza</h3><p class="muted">Prenesi podatke, da jih lahko obnoviš v istem ali drugem brskalniku.</p><div class="row">${btn('↓ Izvozi podatke','export')}${btn('↑ Uvozi podatke function renderJudge(){
 const cats=state.categories.filter(c=>c.questions.length);if(judgeCategory>=cats.length)judgeCategory=Math.max(0,cats.length-1);

 return `${nav}<section class="panel screencontrols"><div class="row" style="align-items:end;gap:14px;flex-wrap:wrap">

 ${interimScope==='question'?`<div class="field" style="max-width:250px"><label>Prikaži rezultate do vprašanja št.</label><input type="number" min="1" max="${Math.max(1,total)}" value="${questionLimit}" data-type="cutoff"></div>`:`<div class="field" style="min-width:260px"><label>Rezultati po krogu</label><select data-type="interimRound">${cats.map((c,i)=>`<option value="${i+1}" ${round===i+1?'selected':''}>${i+1}. krog – ${esc(c.name)}</option>`).join('')}</select></div>`}

let finalSound=true,quizAudioContext=null;
// Izvirni televizijski kvizni zvočni učinki: napetost, prehod in slavnostni zaključek.
function playFinalRevealSound(place){
 if(!finalSound)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!quizAudioContext)quizAudioContext=new AC();
  const ctx=quizAudioContext;ctx.resume();
  const t=ctx.currentTime+.015;
  const master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);
  function tone(freq,start,duration,volume=.1,type='sine',endFreq=null){
   const o=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();
   o.type=type;o.frequency.setValueAtTime(freq,t+start);
   if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+start+duration);
   filter.type='lowpass';filter.frequency.value=1600;
   g.gain.setValueAtTime(.0001,t+start);
   g.gain.exponentialRampToValueAtTime(volume,t+start+.025);
   g.gain.exponentialRampToValueAtTime(.0001,t+start+duration);
   o.connect(filter);filter.connect(g);g.connect(master);
   o.start(t+start);o.stop(t+start+duration+.025);
  }
  function sweep(start,duration,volume=.09){
   const length=Math.max(1,Math.round(ctx.sampleRate*duration));
   const buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);
   for(let i=0;i<length;i++)data[i]=(Math.random()*2-1);
   const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
   src.buffer=buffer;f.type='bandpass';f.Q.value=.8;
   f.frequency.setValueAtTime(260,t+start);
   f.frequency.exponentialRampToValueAtTime(1500,t+start+duration);
   g.gain.setValueAtTime(.0001,t+start);
   g.gain.linearRampToValueAtTime(volume,t+start+duration*.55);
   g.gain.linearRampToValueAtTime(.0001,t+start+duration);
   src.connect(f);f.connect(g);g.connect(master);src.start(t+start);
  }
  // Razkritja 10.–4. mesta: globok televizijski udarec in mehak prehod navzgor.
  if(place>3){
   tone(92,0,.48,.22,'sine',57);
   tone(184,.015,.26,.065,'triangle',110);
   sweep(.02,.48,.075);
   tone(440,.31,.32,.033,'sine',392);
  }else if(place===3){
   // Bron: kratka napetost in dva mogočna poudarka.
   tone(78,0,.8,.22,'sine',55);
   sweep(0,.58,.11);
   tone(196,.18,.56,.10,'triangle');
   tone(293.66,.37,.72,.10,'triangle');
   tone(392,.52,.85,.075,'sine');
  }else if(place===2){
   // Srebro: daljši dramatični dvig.
   tone(70,0,1.2,.24,'sine',52);
   sweep(.03,.9,.12);
   tone(174.61,.2,.8,.095,'triangle');
   tone(261.63,.43,.85,.095,'triangle');
   tone(349.23,.69,.95,.085,'triangle');
   tone(523.25,.95,.65,.045,'sine');
  }else{
   // Zlato: televizijski fanfarni akord z nizkim poudarkom, brez arkadnih piskov.
   tone(65.41,0,1.5,.26,'sine');
   sweep(0,.9,.12);
   [261.63,329.63,392].forEach((f,i)=>tone(f,.18+i*.13,1.35,.09,'triangle'));
   [392,523.25,659.25].forEach((f,i)=>tone(f,.85+i*.09,1.75,.085,'triangle'));
   tone(130.81,.85,1.7,.14,'sine');
   sweep(.85,1.1,.075);
  }
 }catch(e){}
}
function advanceFinalRanking(){
 const n=scores().length;
 if(finalRankingReveal>=n)return;
 finalRankingReveal++;
 playFinalRevealSound(n-finalRankingReveal+1);
}

 <div class="present-sub">✦ TD CER CERŠAK ✦ &nbsp; CIRBEŠKI PUB KVIZ &nbsp; ✦ VELIKI FINALE ✦</div>

 <div class="remaining-title" style="margin-top:25px">${podiumCount?'STOPNIČKE · 3., 2. IN 1. MESTO':'OD ZADNJEGA MESTA NAVZGOR'} · ${count}/${n}</div>
 ${podiumCount?`<div class="interim-podium">${pcol(2)}${pcol(1)}${pcol(3)}</div>`:''}
 <div class="interim-board">${visible.slice().reverse().map(t=>`<div class="interim-row ${t===ranked[n-count]?'new':''}"><span><span class="place">${ranked.indexOf(t)+1}.</span>${esc(t.name)}</span><strong>${t.points} točk</strong></div>`).join('')}</div>
 ${count===0?'<div class="interim-hint">Začni z zadnjim mestom. Pritisni preslednico ali gumb za naslednje mesto.</div>':''}

 ${finished?'<p class="muted" style="margin-top:18px">Čestitke zmagovalcem!</p>':''}
 </div><div class="row screencontrols" style="margin-top:16px">${btn('← Nazaj k sodnikom','goJudge')}</div>`;
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;fullscreen=false;render()}));app.addEventListener('input',e=>{const el=e.target,t=el.dataset.type,id=el.dataset.id;if(!t)return;if(t==='cat')state.categories.find(c=>c.id===id).name=el.value;if(t==='question')questionsRef(id).text=el.value;if(t==='points')questionsRef(id).points=Math.max(0,Number(el.value)||0);if(t==='award')state.answers[id]=el.value===''?null:Math.max(0,Number(el.value)||0);if(t==='manualaward')state.answers[id]={manual:Math.max(0,Number(el.value)||0)};if(t==='team')state.teams[+id]=el.value;if(t==='cutoff'){cutoff=Math.max(1,Math.min(questions().length||1,Number(el.value)||1));state.cutoff=cutoff;interimVisible=false;interimReveal=0;save();render();return}save()});function questionsRef(id){for(const c of state.categories){const q=c.questions.find(q=>q.id===id);if(q)return q}}

]==='object'?null:{manual:0}}if(act==='resetAnswers'){if(!confirm('Res izbrišem vse ocene?'))return;state.answers={}}if(act==='goJudge'){tab='judge';fullscreen=false}if(act==='goPresent'){tab='present';fullscreen=false}if(act==='modeInterim'){presentationMode='interim';interimVisible=false;interimReveal=0}if(act==='modeFinal'){presentationMode='final';finalRankingReveal=0}if(act==='showInterim'){interimVisible=true;interimReveal=0}if(act==='revealInterim')interimReveal=Math.min(scores().length,interimReveal+1);if(act==='allInterim')interimReveal=scores().length;if(act==='revealFinalRank')advanceFinalRanking();if(act==='toggleFinalSound')finalSound=!finalSound;if(act==='allFinalRank')finalRankingReveal=scores().length;if(act==='hideInterim')interimVisible=false;if(act==='reveal')state.reveal=Math.min(3,state.reveal+1);if(act==='restart'){state.reveal=0;finalRankingReveal=0};if(act==='fullscreen'){fullscreen=!fullscreen;if(fullscreen&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!fullscreen&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}if(act==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cirbeski-kviz-podatki.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(act==='import'){document.getElementById('importFile').click();return}save();render()});app.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0]){try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.categories)||!Array.isArray(data.teams)||!data.answers)throw Error();if(!confirm('Uvoz zamenja trenutni kviz. Nadaljujem?'))return;state={...data,teams:data.teams.slice(0,10)};while(state.teams.length<10)state.teams.push('Ekipa '+(state.teams.length+1));save();render()}catch{alert('Datoteka ni veljavna varnostna kopija kviza.')}}});document.
